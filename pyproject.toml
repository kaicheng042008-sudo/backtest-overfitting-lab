[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "overfitlab"
version = "0.1.0"
description = "Small, tested tools for judging whether a backtest result is real."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib"]

[tool.setuptools]
packages = ["overfitlab"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
